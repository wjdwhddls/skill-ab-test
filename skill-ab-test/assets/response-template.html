<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>{{TITLE}}</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #faf9f5; color: #243631; }
    body { margin: 0; padding: 24px; font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    main { max-width: 720px; margin: 0 auto; }
    header { border-bottom: 1px solid #ced8d2; padding-bottom: 18px; }
    h1 { margin: 0; font-size: 22px; line-height: 1.4; font-weight: 700; letter-spacing: -.02em; }
    header p { margin: 8px 0 0; color: #52655f; font-size: 14px; line-height: 1.6; }
    pre { margin: 24px 0 0; font: inherit; font-size: 20px; line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal; }
    footer { margin-top: 28px; border-top: 1px solid #ced8d2; padding-top: 14px; font-size: 12px; line-height: 1.6; color: #52655f; }
    ::selection { background: #d8e9df; color: #193c30; }
  </style>
</head>
<body>
  <main>
    <header><h1>{{HEADING}}</h1><p>{{LABEL}}</p></header>
    <pre data-role="answer-text"><span>{{ANSWER}}</span></pre>
    <footer>제출 원문 표시 화면 · {{NOTICE}}</footer>
  </main>
</body>
</html>
