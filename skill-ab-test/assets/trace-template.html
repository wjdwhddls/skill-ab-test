<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src {{SCRIPT_CSP}}; img-src data:; font-src 'none'; base-uri 'none'; form-action 'none'">
  <title>{{TITLE}}</title>
  <style>
    #skill-ab-dashboard {
      --canvas:#eef4f0;
      --ink:#203d34;
      --muted:#52695f;
      --faint:#5b7066;
      --line:rgba(57,91,72,.14);
      --line-strong:rgba(57,91,72,.24);
      --glass:rgba(255,255,255,.68);
      --glass-deep:rgba(239,245,238,.8);
      --wash:rgba(67,120,83,.06);
      --selected:rgba(182,218,173,.24);
      --accent:#176a50;
      --arm-a:#49617f;
      --arm-b:#177052;
      --good:#236342;
      --bad:#963c38;
      --warning:#79521c;
      color-scheme:light;
      width:100%; margin:0; padding:40px 48px 30px; min-height:100vh;
      background:radial-gradient(ellipse at 93% 0%,rgba(162,206,231,.30),transparent 45%),radial-gradient(ellipse at 6% 68%,rgba(192,217,167,.28),transparent 43%),var(--canvas);
      color:var(--ink); font:16px/1.75 "Batang","바탕","AppleMyungjo","Nanum Myeongjo","Noto Serif KR",serif;
      overflow-wrap:anywhere; word-break:keep-all; -webkit-font-smoothing:antialiased;
      isolation:isolate; caret-color:var(--accent); scrollbar-color:#91ada0 #eaf0ec;
    }
    #skill-ab-dashboard,#skill-ab-dashboard * { box-sizing:border-box; }
    #skill-ab-dashboard > * { width:100%; max-width:1440px; margin-left:auto; margin-right:auto; }
    #skill-ab-dashboard [hidden] { display:none!important; }
    #skill-ab-dashboard h1,#skill-ab-dashboard h2,#skill-ab-dashboard h3,#skill-ab-dashboard h4,#skill-ab-dashboard p,#skill-ab-dashboard pre,#skill-ab-dashboard blockquote { margin:0; }
    #skill-ab-dashboard h1,#skill-ab-dashboard h2,#skill-ab-dashboard h3,#skill-ab-dashboard h4 { line-height:1.4; text-wrap:balance; }
    #skill-ab-dashboard h1 { font-size:30px; letter-spacing:-.025em; font-weight:700; }
    #skill-ab-dashboard h2 { font-size:21px; letter-spacing:-.018em; font-weight:650; }
    #skill-ab-dashboard h3 { font-size:16px; font-weight:650; }
    #skill-ab-dashboard h4 { font-size:14px; font-weight:650; }
    #skill-ab-dashboard a { color:var(--accent); text-underline-offset:3px; text-decoration-thickness:1px; }
    #skill-ab-dashboard a:hover { color:#124e3d; text-decoration-thickness:2px; }
    #skill-ab-dashboard button { font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    #skill-ab-dashboard button:disabled { opacity:.48; cursor:not-allowed; }
    #skill-ab-dashboard :focus-visible { outline:2px solid #176a50; outline-offset:4px; }
    #skill-ab-dashboard ::selection { background:#c9e4d1; color:#fff; }
    #skill-ab-dashboard :target { scroll-margin-top:24px; }
    #skill-ab-dashboard .eyebrow { display:none; }
    #skill-ab-dashboard .muted,#skill-ab-dashboard .section-note { color:var(--muted); }
    #skill-ab-dashboard .section-note { margin-top:6px; font-size:13px; max-width:78ch; line-height:1.65; }
    #skill-ab-dashboard .appbar { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:0 0 20px; }
    #skill-ab-dashboard .appbar > div { min-width:0; }
    #skill-ab-dashboard .appbar > a { flex:0 0 auto; white-space:nowrap; }
    #skill-ab-dashboard .appbar p { margin-top:4px; color:var(--muted); font-size:13px; }
    #skill-ab-dashboard .appbar .state { white-space:nowrap; }
    #skill-ab-dashboard .source-link { flex:0 0 auto; color:var(--muted); font-size:12px; white-space:nowrap; }
    #skill-ab-dashboard .summary-strip {
      display:grid; grid-template-columns:minmax(0,1.35fr) minmax(260px,.85fr); gap:24px;
      padding:19px 22px; border:1px solid var(--line-strong); border-radius:16px;
      background:linear-gradient(120deg,rgba(255,255,255,.78),rgba(239,249,230,.64));
      -webkit-backdrop-filter:blur(24px); backdrop-filter:blur(24px);
    }
    #skill-ab-dashboard .summary-copy { min-width:0; align-self:center; }
    #skill-ab-dashboard .summary-copy h2 { font-size:16px; margin-bottom:7px; }
    #skill-ab-dashboard .summary-copy p { max-width:72ch; }
    #skill-ab-dashboard .what { color:var(--muted); font-size:13px; }
    #skill-ab-dashboard .takeaway { font-weight:550; line-height:1.65; }
    #skill-ab-dashboard .summary-copy .what + .takeaway { margin-top:8px; }
    #skill-ab-dashboard .summary-metrics { display:flex; flex-direction:column; justify-content:center; gap:9px; padding-left:23px; border-left:1px solid var(--line); }
    #skill-ab-dashboard .summary-metrics p { color:var(--muted); font-size:12px; }
    #skill-ab-dashboard .summary-metrics strong { color:var(--ink); font-weight:600; }
    #skill-ab-dashboard .verdict-counts { display:flex; align-items:center; flex-wrap:wrap; gap:7px; margin-top:12px; }
    #skill-ab-dashboard .metric-chip { display:inline-flex; align-items:center; gap:6px; padding:3px 8px; border-radius:6px; background:rgba(67,120,83,.07); color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
    #skill-ab-dashboard .metric-chip strong { color:var(--ink); font-weight:650; }
    #skill-ab-dashboard .dashboard-tabs { display:flex; gap:4px; margin-top:21px; margin-bottom:22px; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:thin; }
    #skill-ab-dashboard .dashboard-tabs button { position:relative; flex:0 0 auto; min-height:46px; padding:10px 17px 13px; border:0; background:transparent; color:var(--muted); font-size:14px; font-weight:550; transition:background-color 160ms ease-out,color 160ms ease-out; }
    #skill-ab-dashboard .dashboard-tabs button:hover { color:var(--ink); background:var(--wash); }
    #skill-ab-dashboard .dashboard-tabs button[aria-selected="true"] { color:#124e3d; }
    #skill-ab-dashboard .dashboard-tabs button[aria-selected="true"]::after { position:absolute; content:""; right:15px; bottom:0; left:15px; height:2px; background:#177052; border-radius:2px 2px 0 0; }
    #skill-ab-dashboard .dashboard-tabs button:focus-visible { outline-offset:-4px; border-radius:8px 8px 0 0; }
    #skill-ab-dashboard .dashboard-panel { padding-bottom:12px; }
    #skill-ab-dashboard .dashboard-panel > h2 { margin-bottom:5px; }
    #skill-ab-dashboard .section-heading { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:17px; }
    #skill-ab-dashboard .section-heading > span { color:var(--muted); font-size:12px; }
    #skill-ab-dashboard .agent-grid,#skill-ab-dashboard .answer-grid,#skill-ab-dashboard .columns { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; }
    #skill-ab-dashboard .agent-grid { margin-top:18px; align-items:start; }
    #skill-ab-dashboard .agent-grid > *,#skill-ab-dashboard .answer-grid > *,#skill-ab-dashboard .columns > * { min-width:0; }
    #skill-ab-dashboard .agent-panel {
      --arm:var(--arm-a); min-width:0; overflow:hidden; border:1px solid var(--line-strong); border-radius:16px;
      background:var(--glass); -webkit-backdrop-filter:blur(22px); backdrop-filter:blur(22px);
    }
    #skill-ab-dashboard .agent-panel[data-arm="treatment"],#skill-ab-dashboard .answer-panel[data-arm="treatment"] { --arm:var(--arm-b); }
    #skill-ab-dashboard .agent-header { min-height:112px; padding:18px 20px 15px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.25); }
    #skill-ab-dashboard .agent-header h3 { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
    #skill-ab-dashboard .agent-label { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; color:var(--arm); font-size:12px; font-weight:650; letter-spacing:.01em; }
    #skill-ab-dashboard .agent-state { display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; font-weight:400; }
    #skill-ab-dashboard .agent-state::before { content:""; width:5px; height:5px; flex:0 0 5px; border-radius:50%; background:var(--arm); }
    #skill-ab-dashboard .agent-header p { margin-top:5px; font-size:13px; color:var(--muted); }
    #skill-ab-dashboard .agent-stats { display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; margin-top:9px; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
    #skill-ab-dashboard .agent-stats strong { color:var(--ink); font-weight:550; }
    #skill-ab-dashboard .agent-body { display:grid; grid-template-columns:minmax(180px,.40fr) minmax(0,.60fr); min-height:355px; }
    #skill-ab-dashboard .action-list { display:flex; flex-direction:column; gap:4px; max-height:470px; overflow:auto; margin:0; padding:12px 9px; list-style:none; border-right:1px solid var(--line); background:rgba(233,241,231,.4); scrollbar-width:thin; }
    #skill-ab-dashboard .action-list > * { flex-shrink:0; }
    #skill-ab-dashboard .action-list li { min-width:0; margin:0; }
    #skill-ab-dashboard .aux-events { grid-column:1 / -1; width:100%; min-width:0; margin-top:7px; border-top:1px solid var(--line); }
    #skill-ab-dashboard .aux-events > summary { display:list-item; width:100%; min-height:44px; padding:12px 9px; font-size:12px; line-height:20px; }
    #skill-ab-dashboard .aux-events[open] > summary { margin-bottom:2px; }
    #skill-ab-dashboard .aux-events ol,#skill-ab-dashboard .aux-events ul { display:flex; flex-direction:column; gap:4px; width:100%; margin:0; padding:0; list-style:none; }
    #skill-ab-dashboard .aux-events li { width:100%; margin:0; padding:0; }
    #skill-ab-dashboard .aux-events > .action-button { margin-top:4px; }
    #skill-ab-dashboard .action-button {
      display:grid; grid-template-columns:22px minmax(0,1fr); gap:3px 8px; width:100%; min-height:66px; padding:10px 9px;
      text-align:left; border:1px solid transparent; border-radius:9px; background:transparent; color:var(--muted);
      transition:background-color 160ms ease-out,border-color 160ms ease-out,color 160ms ease-out;
    }
    #skill-ab-dashboard .action-button:hover { background:var(--wash); color:var(--ink); }
    #skill-ab-dashboard .action-button[aria-pressed="true"] { border-color:rgba(57,91,72,.25); background:var(--selected); color:var(--ink); }
    #skill-ab-dashboard .action-number { grid-column:1; grid-row:1 / span 3; padding-top:1px; color:var(--faint); font-size:11px; font-variant-numeric:tabular-nums; }
    #skill-ab-dashboard .action-button[aria-pressed="true"] .action-number { color:var(--arm); }
    #skill-ab-dashboard .action-title { grid-column:2; color:inherit; font-size:13px; font-weight:550; line-height:1.45; }
    #skill-ab-dashboard .action-meta { grid-column:2; display:flex; flex-wrap:wrap; gap:4px 8px; color:var(--muted); font-size:11px; line-height:1.55; font-variant-numeric:tabular-nums; }
    #skill-ab-dashboard .action-kind { color:var(--muted); font-size:11px; font-weight:450; }
    #skill-ab-dashboard .action-button .action-kind { grid-column:2; }
    #skill-ab-dashboard .action-inspector { min-width:0; padding:19px 19px 22px; }
    #skill-ab-dashboard .action-detail > h4 { margin-bottom:10px; font-size:15px; }
    #skill-ab-dashboard .action-detail > p + h4,#skill-ab-dashboard .action-detail > pre + h4,#skill-ab-dashboard .action-detail > details + h4 { margin-top:17px; }
    #skill-ab-dashboard .action-detail > p { margin-top:8px; }
    #skill-ab-dashboard .action-detail .action-kind { display:inline-block; margin-bottom:9px; color:var(--arm); }
    #skill-ab-dashboard .event-preview { margin:12px 0; color:#365248; font-size:13px; line-height:1.75; white-space:pre-wrap; overflow-wrap:anywhere; word-break:normal; }
    #skill-ab-dashboard .event-output { margin-top:12px; }
    #skill-ab-dashboard .source-line { display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:12px; color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
    #skill-ab-dashboard .source-line a { color:var(--arm); }
    #skill-ab-dashboard .no-tools { margin:12px 0; padding:11px 12px; background:var(--wash); border-radius:7px; color:var(--muted); font-size:12px; line-height:1.65; }
    #skill-ab-dashboard .no-tools strong { color:var(--ink); font-weight:550; }
    #skill-ab-dashboard .agent-panel > .no-tools { margin:0; padding:10px 18px; border-bottom:1px solid var(--line); border-radius:0; }
    #skill-ab-dashboard .agent-panel > .trace-footnote { margin:0; padding:11px 18px; border-top:1px solid var(--line); background:rgba(233,241,231,.35); }
    #skill-ab-dashboard .action-list .no-tools { padding:10px 9px; margin:0 0 6px; background:transparent; }
    #skill-ab-dashboard details { min-width:0; }
    #skill-ab-dashboard details > summary { width:fit-content; max-width:100%; padding:4px 0; cursor:pointer; color:var(--accent); font-size:12px; font-weight:550; line-height:1.55; }
    #skill-ab-dashboard details > summary::marker { color:#597669; font-size:10px; }
    #skill-ab-dashboard details[open] > summary { margin-bottom:10px; }
    #skill-ab-dashboard pre { font:12px/1.75 ui-monospace,"SFMono-Regular",Consolas,monospace; white-space:pre-wrap; word-break:normal; overflow-wrap:anywhere; tab-size:2; }
    #skill-ab-dashboard .event-output pre,#skill-ab-dashboard .action-detail pre,#skill-ab-dashboard .timeline details pre,#skill-ab-dashboard #technical-details pre {
      max-height:360px; overflow:auto; margin-top:10px; padding:12px 13px; border:1px solid var(--line); border-radius:8px;
      background:var(--glass-deep); color:#28483b; scrollbar-width:thin; scrollbar-gutter:stable;
    }
    #skill-ab-dashboard .command { margin:9px 0; padding:9px 11px; background:var(--glass-deep); border-radius:6px; color:#28483b; }
    #skill-ab-dashboard .action-detail details { margin-top:12px; }
    #skill-ab-dashboard .answer-toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:17px 0; }
    #skill-ab-dashboard .answer-toolbar button { min-height:36px; padding:6px 13px; border:1px solid var(--line-strong); border-radius:7px; background:transparent; color:var(--muted); font-size:13px; }
    #skill-ab-dashboard .answer-toolbar button:hover { color:var(--ink); background:var(--wash); }
    #skill-ab-dashboard .answer-toolbar button[aria-pressed="true"],#skill-ab-dashboard .answer-toolbar button[aria-selected="true"] { color:var(--ink); background:var(--selected); border-color:#719b86; }
    #skill-ab-dashboard .answer-panel { --arm:var(--arm-a); padding:20px 22px; border:1px solid var(--line-strong); border-radius:14px; background:var(--glass); }
    #skill-ab-dashboard .answer-panel > h3 { padding-bottom:12px; margin-bottom:17px; border-bottom:1px solid var(--line); }
    #skill-ab-dashboard .answer-case { min-width:0; }
    #skill-ab-dashboard .answer-case h4 { margin-bottom:12px; color:var(--muted); font-size:13px; }
    #skill-ab-dashboard .answer,#skill-ab-dashboard .answer-case pre { font-family:inherit; font-size:14px; line-height:1.9; color:#213e33; }
    #skill-ab-dashboard .answer-case details { margin-top:16px; }
    #skill-ab-dashboard .verdict-layout { display:grid; grid-template-columns:minmax(220px,.30fr) minmax(0,.70fr); gap:20px; margin-top:18px; align-items:start; }
    #skill-ab-dashboard .verdict-list { display:flex; flex-direction:column; gap:7px; margin:0; padding:0; list-style:none; }
    #skill-ab-dashboard .verdict-list li { margin:0; }
    #skill-ab-dashboard .verdict-button { display:flex; flex-direction:column; align-items:flex-start; gap:9px; width:100%; min-height:82px; padding:15px 17px; text-align:left; border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.54); color:var(--muted); font-size:14px; }
    #skill-ab-dashboard .verdict-button:hover { background:var(--wash); color:var(--ink); }
    #skill-ab-dashboard .verdict-button[aria-pressed="true"],#skill-ab-dashboard .verdict-button[aria-selected="true"] { background:var(--selected); border-color:#719b86; color:var(--ink); }
    #skill-ab-dashboard .verdict-inspector { min-width:0; padding:22px; border:1px solid var(--line-strong); border-radius:14px; background:var(--glass); }
    #skill-ab-dashboard .verdict-detail > h3 { margin-bottom:9px; }
    #skill-ab-dashboard .verdict-detail > p { max-width:75ch; margin-top:10px; color:#365248; font-size:14px; line-height:1.75; }
    #skill-ab-dashboard .verdict { display:inline-flex; align-items:center; gap:5px; width:fit-content; padding:2px 7px; border-radius:5px; color:#4b6658; background:rgba(67,120,83,.07); font-size:11px; font-weight:600; line-height:1.65; white-space:nowrap; }
    #skill-ab-dashboard .verdict.improved { color:var(--good); background:rgba(146,196,139,.1); }
    #skill-ab-dashboard .verdict.worsened { color:var(--bad); background:rgba(221,148,141,.1); }
    #skill-ab-dashboard .verdict.undetermined { color:var(--warning); background:rgba(212,184,125,.1); }
    #skill-ab-dashboard .evidence-columns { margin-top:20px; padding-top:17px; border-top:1px solid var(--line); }
    #skill-ab-dashboard .evidence { min-width:0; }
    #skill-ab-dashboard .evidence h4 { margin-bottom:10px; color:var(--muted); font-size:12px; }
    #skill-ab-dashboard .evidence blockquote { padding-left:12px; border-left:1px solid var(--line-strong); color:#213e33; font-size:14px; line-height:1.8; white-space:pre-wrap; word-break:normal; }
    #skill-ab-dashboard .evidence > a { display:inline-block; margin-top:12px; font-size:12px; }
    #skill-ab-dashboard .evidence > p { font-size:13px; line-height:1.75; }
    #skill-ab-dashboard .evidence > .muted { margin-top:8px; font-size:12px; }
    #skill-ab-dashboard .reason { margin-top:20px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; line-height:1.8; }
    #skill-ab-dashboard .reason strong { color:var(--ink); font-weight:550; }
    #skill-ab-dashboard .context-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; align-items:start; }
    #skill-ab-dashboard .context-grid > * { min-width:0; }
    #skill-ab-dashboard .context-grid > section,#skill-ab-dashboard .dashboard-panel > #conditions,#skill-ab-dashboard .dashboard-panel > #observations,#skill-ab-dashboard .dashboard-panel > #scope { margin-top:20px; padding:21px 22px; border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.62); }
    #skill-ab-dashboard .table-wrap { margin-top:16px; overflow-x:auto; scrollbar-width:thin; }
    #skill-ab-dashboard table { width:100%; border-collapse:collapse; font-size:13px; line-height:1.65; font-variant-numeric:tabular-nums; }
    #skill-ab-dashboard caption { text-align:left; color:var(--muted); font-size:12px; padding-bottom:10px; }
    #skill-ab-dashboard th,#skill-ab-dashboard td { padding:11px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    #skill-ab-dashboard thead th { background:var(--wash); color:var(--muted); font-size:12px; font-weight:550; }
    #skill-ab-dashboard tbody th { width:24%; color:#294e3c; font-weight:550; }
    #skill-ab-dashboard tbody td { color:#405e4f; }
    #skill-ab-dashboard tbody tr:last-child > * { border-bottom:0; }
    #skill-ab-dashboard #conditions td:last-child { color:var(--muted); white-space:nowrap; }
    #skill-ab-dashboard #observations > details { margin-top:14px; font-size:12px; }
    #skill-ab-dashboard .metric-ref { display:block; margin-top:4px; font-size:11px; }
    #skill-ab-dashboard .scope-columns { margin-top:19px; }
    #skill-ab-dashboard .scope-columns > section > h3 { padding-bottom:11px; border-bottom:1px solid var(--line-strong); font-size:14px; }
    #skill-ab-dashboard .scope-card { padding:17px 0; font-size:13px; }
    #skill-ab-dashboard .scope-card + .scope-card { border-top:1px solid var(--line); }
    #skill-ab-dashboard .scope-card h4 { font-size:14px; }
    #skill-ab-dashboard .scope-card dl { display:grid; grid-template-columns:18px minmax(0,1fr); gap:6px 8px; margin:11px 0; }
    #skill-ab-dashboard .scope-card dt { color:var(--muted); font-size:12px; font-weight:650; }
    #skill-ab-dashboard .scope-card dd { margin:0; color:#28483b; }
    #skill-ab-dashboard .scope-card p { margin-top:8px; }
    #skill-ab-dashboard .scope-conclusion { font-weight:550; }
    #skill-ab-dashboard .scope-card details { margin-top:9px; }
    #skill-ab-dashboard .scope-card .evidence + .evidence { margin-top:17px; }
    #skill-ab-dashboard .scope-card.unknown p { color:var(--muted); }
    #skill-ab-dashboard .scope-next { font-size:12px; }
    #skill-ab-dashboard .control > p { margin-top:7px; color:var(--muted); font-size:13px; }
    #skill-ab-dashboard .control .columns { margin-top:16px; }
    #skill-ab-dashboard .arm-control { padding:13px 15px; background:var(--wash); border-radius:8px; }
    #skill-ab-dashboard .control-title { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
    #skill-ab-dashboard .arm-control p { margin-top:5px; font-size:12px; }
    #skill-ab-dashboard .state { color:var(--muted); font-size:12px; }
